# docker/nginx.conf
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Maximum number of simultaneous active connections per worker process
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Custom log format with Request ID for distributed tracing & upstream metrics
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'req_id="$request_id"';

    access_log  /var/log/nginx/access.log  main;

    # Network I/O and performance optimization
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    client_max_body_size 10M;

    # Hide Nginx version information (Security by obscurity)
    server_tokens off;

    # Dynamic Connection header mapping for WebSocket and standard HTTP upgrades
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Anti-DDoS: Rate limiting & concurrent connection limiting zones
    limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream cluster definition for Backend API Service (Port 8082)
    upstream backend_cluster {
        server backend-api:8082;
        keepalive 32;
    }

    # Upstream cluster definition for Frontend SSR Service (Port 8081)
    upstream frontend_cluster {
        server frontend-app:8081;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Hardened HTTP Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Enforce maximum concurrent connections per client IP
        limit_conn conn_limit 20;

        # Dedicated Nginx health probe (Bypasses logging & rate limits)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # 1. Forward API, metrics, and health probe traffic to the Backend
        location ~ ^/(api|healthz|metrics|ready) {
            # Apply API rate limit zone with a non-delaying burst capacity of 20
            limit_req zone=api_ratelimit burst=20 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # Upstream keep-alive connection headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "";

            # Forward client identification headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward incoming Request ID or inject generated Nginx Request ID
            proxy_set_header X-Request-Id $request_id;
            add_header X-Request-Id $request_id always;

            # Upstream proxy timeouts to mitigate Slowloris attacks
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer configuration
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }

        # 2. Forward all client web and SSR traffic to the Frontend service
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;

            # WebSocket and HTTP Upgrade proxy headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Forward client identification headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}