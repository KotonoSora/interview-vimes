# docker/nginx.conf
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Định dạng Log tích hợp Request ID cho Distributed Tracing
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'req_id="$request_id"';

    access_log  /var/log/nginx/access.log  main;

    # Tối ưu hóa I/O và truyền tải mạng
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    client_max_body_size 10M;

    # Che giấu thông tin Nginx (Security by Obscurity)
    server_tokens off;

    # Anti-DDoS: Rate Limiting & Connection Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream kết nối tới Backend Service (Port 8082)
    upstream backend_cluster {
        server backend-api:8082;
        keepalive 32;
    }

    # Upstream kết nối tới Frontend Service (Port 8081)
    upstream frontend_cluster {
        server frontend-app:8081;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Hardening Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Áp dụng giới hạn số kết nối đồng thời trên mỗi IP
        limit_conn conn_limit 20;

        # Healthcheck endpoint riêng của Nginx (Probe không rate limit)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # 1. Chuyển tiếp API và metrics traffic sang Backend
        location ~ ^/(api|healthz|metrics|ready) {
            # Giới hạn tần suất request (Burst 20 không delay)
            limit_req zone=api_ratelimit burst=20 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # HTTP Keep-Alive & Upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "";

            # Forwarding Client Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward Client Request ID hoặc dùng Nginx Request ID tự sinh
            proxy_set_header X-Request-Id $request_id;
            add_header X-Request-Id $request_id always;

            # Proxy Timeouts chống Slowloris attack
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer config
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }

        # 2. Chuyển tiếp tất cả traffic giao diện người dùng sang Frontend
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}