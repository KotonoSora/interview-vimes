# docker/docker-compose.yml
version: "3.8"

services:
  postgres-db:
    image: postgres:18.6-alpine
    container_name: vimes_postgres_db
    restart: always
    environment:
      POSTGRES_DB: vimes_inventory
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
    ports:
      # Map cổng 5432 ra máy host để backend và Vitest kết nối trực tiếp
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ../sql/03_security_roles.sql:/docker-entrypoint-initdb.d/03_security_roles.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d vimes_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: vimes_inventory_pgdata
