# docker/docker-compose.yml
name: vimes-inventory-prod

services:
  # Lớp Reverse Proxy & Anti-DDoS (Nginx Mainline 1.31.4 Alpine)
  reverse-proxy:
    image: nginx:1.31.4-alpine
    container_name: vimes_reverse_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-api:
        condition: service_healthy

  # PostgreSQL v18.6 Alpine
  postgres-db:
    image: postgres:18.6-alpine
    container_name: vimes_postgres_db
    restart: always
    environment:
      POSTGRES_DB: vimes_inventory
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ../sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ../sql/03_security_roles.sql:/docker-entrypoint-initdb.d/03_security_roles.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U postgres_user -d vimes_inventory",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Backend REST API Service
  backend-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: vimes_backend_api
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres_user:postgres_password@postgres-db:5432/vimes_inventory
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
    name: vimes_inventory_pgdata
